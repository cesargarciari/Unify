services:
  db:
    image: postgres:16-alpine
    container_name: campus_event_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/database_schema1.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database_seed2.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend        # uses backend/Dockerfile
    container_name: campus_event_hub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db/unify
      JWT_SECRET: dev-secret-change-me
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    # 👇 if your package.json is inside frontend/513-app (very likely):
    build:
      context: ./frontend/513-app
    # If package.json is in frontend/, change context to ./frontend instead.
    container_name: campus_event_hub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  db_data:
